<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Projects — Younsoo Lim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300,0,0&amp;icon_names=close,lock,lock_open,menu&amp;display=block" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: 'rgb(var(--c-bg) / <alpha-value>)',
            surface: 'rgb(var(--c-surface) / <alpha-value>)',
            border: 'rgb(var(--c-border) / <alpha-value>)',
            muted: 'rgb(var(--c-muted) / <alpha-value>)',
            accent: 'rgb(var(--c-accent) / <alpha-value>)',
            heading: 'rgb(var(--c-heading) / <alpha-value>)',
            body: 'rgb(var(--c-body) / <alpha-value>)',
          },
          fontSize: {
            sm: '0.9375rem',
          },
          fontFamily: {
            sans: ['Noto Sans KR', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/crypto.js"></script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
      20%, 40%, 60%, 80% { transform: translateX(4px); }
    }
    .shake {
      animation: shake 0.5s ease-in-out;
    }
  </style>
</head>
<body class="bg-bg text-heading">

  <!-- Navigation -->
  <nav class="fixed top-0 w-full z-50 bg-bg/80 backdrop-blur-md">
    <div class="max-w-[1400px] mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="nav-logo">Younsoo Lim</a>
      <!-- Desktop nav links (hidden on mobile) -->
      <div class="nav-links hidden md:flex gap-8 text-sm text-body ml-auto" id="desktop-nav">
        <a href="index.html#projects" class="hover:text-heading transition">Projects</a>
        <a href="index.html#about" class="hover:text-heading transition">About</a>
        <a href="index.html#contact" class="hover:text-heading transition">Contact</a>
        <a href="private.html" class="text-heading transition flex items-center gap-1.5">
          <span class="material-symbols-outlined icon-sm text-muted" aria-hidden="true">lock</span>
          Private
        </a>
      </div>

      <!-- Hamburger button (visible on mobile only) -->
      <button type="button" id="hamburger-btn" class="btn btn--ghost btn--icon mobile-menu-toggle" aria-label="Toggle menu">
        <span class="material-symbols-outlined icon-sm" aria-hidden="true">menu</span>
      </button>
    </div>

    <!-- Mobile menu (hidden by default, slides down) -->
    <div id="mobile-menu" class="md:hidden hidden border-t border-border bg-bg/95 backdrop-blur-md">
      <div class="flex flex-col px-6 py-4 gap-4 text-sm text-muted">
        <a href="index.html#projects" class="hover:text-heading transition">Projects</a>
        <a href="index.html#about" class="hover:text-heading transition">About</a>
        <a href="index.html#contact" class="hover:text-heading transition">Contact</a>
        <a href="private.html" class="text-heading transition flex items-center gap-1.5">
          <span class="material-symbols-outlined icon-sm text-muted" aria-hidden="true">lock</span>
          Private
        </a>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <section class="max-w-[1400px] mx-auto px-6 pt-32 pb-24">
    <h2 class="text-2xl font-bold mb-4">Private Projects</h2>
    <p class="text-muted mb-8">This section contains NDA-protected work. Enter the password to view.</p>

    <!-- Password Form -->
    <div id="password-form" class="max-w-sm">
      <div class="bg-surface border border-border rounded-lg p-6">
        <form id="decrypt-form" class="flex gap-3">
          <input
            type="password"
            id="password-input"
            placeholder="Password"
            autocomplete="off"
            class="min-w-0 flex-1 bg-transparent border border-border rounded-lg px-4 py-2 text-sm text-heading placeholder-muted focus:outline-none focus:border-muted transition"
          >
          <button
            type="submit"
            class="btn btn--filled shrink-0"
          >Enter</button>
        </form>
        <p id="error-message" class="hidden text-red-500 text-sm mt-3">Incorrect password.</p>
      </div>
      <p class="text-xs text-muted/50 mt-4">Contact me for access credentials.</p>
    </div>

    <!-- Decrypted content area -->
    <div id="private-content" class="hidden mt-12"></div>
  </section>

  <!-- Encrypted data blob -->
  <script type="application/encrypted" id="encrypted-data"><!-- Replace with encrypted content from tools/encrypt.html --></script>

  <!-- Footer -->
  <footer class="border-t border-border py-8 text-center text-muted text-xs">
    <p>&copy; 2026 Younsoo Lim. All rights reserved.</p>
  </footer>

  <script>
    // --- Mobile hamburger menu toggle ---
    (function () {
      var hamburgerBtn = document.getElementById('hamburger-btn');
      var mobileMenu = document.getElementById('mobile-menu');

      if (hamburgerBtn && mobileMenu) {
        function setMenuOpen(open) {
          mobileMenu.classList.toggle('hidden', !open);
          hamburgerBtn.setAttribute('aria-expanded', String(open));
          hamburgerBtn.querySelector('.material-symbols-outlined').textContent = open ? 'close' : 'menu';
        }
        hamburgerBtn.setAttribute('aria-controls', 'mobile-menu');
        setMenuOpen(false);
        hamburgerBtn.addEventListener('click', function () {
          setMenuOpen(mobileMenu.classList.contains('hidden'));
        });

        var mobileLinks = mobileMenu.querySelectorAll('a');
        mobileLinks.forEach(function (link) {
          link.addEventListener('click', function () {
            setMenuOpen(false);
          });
        });
      }
    })();

    // --- Decrypt logic ---
    (function () {
      var form = document.getElementById('decrypt-form');
      var passwordInput = document.getElementById('password-input');
      var errorMessage = document.getElementById('error-message');
      var passwordForm = document.getElementById('password-form');
      var privateContent = document.getElementById('private-content');
      var encryptedDataEl = document.getElementById('encrypted-data');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        var password = passwordInput.value.trim();
        if (!password) return;

        // Get encrypted blob
        var blob = (encryptedDataEl.textContent || '').trim();

        // Check if blob is empty or just a comment
        if (!blob || blob.startsWith('<!--') || blob.length < 40) {
          privateContent.innerHTML =
            '<p class="text-muted text-sm">No encrypted content available. Use tools/encrypt.html to generate.</p>';
          privateContent.classList.remove('hidden');
          passwordForm.classList.add('hidden');
          return;
        }

        try {
          var html = await decryptContent(blob, password);
          privateContent.innerHTML = html;
          privateContent.classList.remove('hidden');
          passwordForm.classList.add('hidden');
          errorMessage.classList.add('hidden');
        } catch (err) {
          // Wrong password
          errorMessage.classList.remove('hidden');
          passwordInput.classList.add('shake');
          setTimeout(function () {
            passwordInput.classList.remove('shake');
          }, 500);
        }
      });
    })();
  </script>
</body>
</html>
